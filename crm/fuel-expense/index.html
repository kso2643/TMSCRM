<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script>
  // Match the theme before first paint so this page never flashes light
  // when the rest of the CRM is in dark mode. (AppShell.mount also does
  // this, but that runs after the stylesheet's already painted once.)
  try {
    if (localStorage.getItem('crm_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  } catch (e) {}
</script>
<script src="/appointments-reminder-app.js" defer></script><script src="/crm-global.js" defer></script></head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors">

<script src="/app-shell.js"></script>
<script src="/fuel-expense-app.js"></script>
<script>
  AppShell.mount({ activeHref: '/fuel-expense/', title: 'Fuel expense' }, function (content) {
    window.FuelExpense.mountPage(content);
  });
</script>
</body>
</html>
